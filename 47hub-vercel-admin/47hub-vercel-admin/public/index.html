<style>
:root{
  --bg:#d4eaff;--surface:#fff;--ink:#12142b;--muted:#555a7a;--accent:#3a3af4;--on-accent:#fff;
  --coral:#ff6b4a;--sun:#ffd166;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --text:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;color:var(--ink);font:16px/1.55 var(--text);background-color:var(--bg);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:900px;margin:0 auto;padding:36px 20px 70px}
.bg-donut{position:fixed;right:-14vmin;bottom:-14vmin;width:min(84vmin,640px);height:auto;opacity:.22;transform:rotate(-14deg);z-index:-1;pointer-events:none;user-select:none}
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:18px}
.logo{width:clamp(76px,19vw,108px);height:auto;flex:none;filter:drop-shadow(4px 4px 0 var(--ink))}
h1{font:800 clamp(2.8rem,10vw,4.8rem)/.92 var(--display);letter-spacing:-.035em;margin:0}
.sub{color:var(--muted);margin:12px 0 0;font-size:1.05rem}
.tag{margin:0 10px 0 0;padding:12px 20px;border:2px solid var(--ink);border-radius:16px;background:var(--sun);color:#12142b;font:800 clamp(1.1rem,4vw,1.5rem) var(--display);box-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.thumb{height:160px;background:var(--bg);display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.is-jar{background:repeating-linear-gradient(-45deg,var(--coral) 0 14px,color-mix(in srgb,var(--coral) 82%,#fff) 14px 28px)}
.jar{font:800 2.6rem var(--display);letter-spacing:-.02em;color:#12142b;background:var(--sun);border:2px solid #12142b;border-radius:14px;padding:2px 16px;transform:rotate(-4deg)}
.body{padding:14px 16px 6px;display:flex;flex-direction:column;gap:2px;flex:1}
.name{font:700 1.05rem var(--display);word-break:break-all}
.meta{color:var(--muted);font-size:.9rem}
.row{padding:10px 16px 16px}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;border-radius:999px;border:2px solid var(--ink);background:var(--accent);color:var(--on-accent);padding:8px 16px}
.btn[aria-disabled="true"]{background:var(--surface);color:var(--muted);pointer-events:none}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Catálogo estilo PLP: búsqueda, filtros y ordenamiento */
.catalog-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.catalog-title{font:800 clamp(1.6rem,5vw,2.2rem)/1 var(--display);margin:0}
.catalog-note{color:var(--muted);margin:8px 0 0}
.catalog-tools{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:10px;margin:0 0 22px}
.catalog-tools input,.catalog-tools select{min-width:0;width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:13px;padding:11px 13px;box-shadow:3px 3px 0 var(--ink)}
.catalog-tools input:focus-visible,.catalog-tools select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.catalog-status{color:var(--muted);font-size:.92rem;margin:0 0 16px}
.empty-state{background:#fff;border:2px dashed var(--ink);border-radius:18px;padding:26px;text-align:center;color:var(--muted);grid-column:1/-1}
@media(max-width:620px){.catalog-tools{grid-template-columns:1fr 1fr}.catalog-tools input{grid-column:1/-1}}

</style>
</head>

<script>
/* ============================================================
   AQUÍ AGREGAS TUS ARCHIVOS. Una línea por archivo:
   - nombre: cómo se ve en la tarjeta
   - desc:   texto corto (opcional)
   - url:    enlace de descarga (Google Drive, Dropbox, GitHub Releases...)
   - tipo:   "jar" o "imagen"
   - imagen: solo para tipo "imagen": enlace o nombre del archivo de la foto
   Si url está vacío, el botón sale apagado ("Próximamente").
   ============================================================ */
let ARCHIVOS = [];

const list = document.getElementById('list');
const searchInput = document.getElementById('catalog-search');
const filterSelect = document.getElementById('catalog-filter');
const sortSelect = document.getElementById('catalog-sort');
const status = document.getElementById('catalog-status');
const suggestions = document.getElementById('file-suggestions');

const PAGE_SIZE = 40;
let visibleCount = PAGE_SIZE;
let filteredFiles = [];

function readUrlState() {
  const params = new URLSearchParams(location.search);
  searchInput.value = params.get('q') || '';
  filterSelect.value = ['todos', 'jar', 'imagen'].includes(params.get('tipo')) ? params.get('tipo') : 'todos';
  sortSelect.value = ['relevancia', 'nombre-asc', 'nombre-desc'].includes(params.get('orden')) ? params.get('orden') : 'relevancia';
}

function updateUrl() {
  const params = new URLSearchParams();
  if (searchInput.value.trim()) params.set('q', searchInput.value.trim());
  if (filterSelect.value !== 'todos') params.set('tipo', filterSelect.value);
  if (sortSelect.value !== 'relevancia') params.set('orden', sortSelect.value);
  const query = params.toString();
  history.replaceState(null, '', query ? `${location.pathname}?${query}` : location.pathname);
}

function renderCard(f) {
  const card = document.createElement('article');
  card.className = 'card';
  const th = document.createElement('div');
  th.className = f.tipo === 'jar' ? 'thumb is-jar' : 'thumb';

  if (f.tipo === 'jar') {
    const j = document.createElement('div');
    j.className = 'jar';
    j.textContent = '.jar';
    th.appendChild(j);
  } else if (f.imagen) {
    const i = document.createElement('img');
    i.src = f.imagen;
    i.alt = f.nombre;
    i.loading = 'lazy';
    th.appendChild(i);
  }

  const body = document.createElement('div');
  body.className = 'body';
  const n = document.createElement('div');
  n.className = 'name';
  n.textContent = f.nombre;
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = f.desc || (f.tipo === 'jar' ? 'Mod descargable' : 'Archivo de imagen');
  body.append(n, m);

  const row = document.createElement('div');
  row.className = 'row';
  const a = document.createElement('a');
  a.className = 'btn';
  if (f.url) {
    a.href = f.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = 'Descargar';
  } else {
    a.setAttribute('aria-disabled', 'true');
    a.textContent = 'Próximamente';
  }
  row.appendChild(a);
  card.append(th, body, row);
  return card;
}

function applyListing({reset = true} = {}) {
  if (reset) visibleCount = PAGE_SIZE;
  const term = searchInput.value.trim().toLocaleLowerCase('es');
  const type = filterSelect.value;
  const sort = sortSelect.value;

  filteredFiles = ARCHIVOS.filter(f => {
    const matchesText = !term || `${f.nombre} ${f.desc || ''}`.toLocaleLowerCase('es').includes(term);
    const matchesType = type === 'todos' || f.tipo === type;
    return matchesText && matchesType;
  });

  if (sort === 'nombre-asc') filteredFiles.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  if (sort === 'nombre-desc') filteredFiles.sort((a, b) => b.nombre.localeCompare(a.nombre, 'es'));

  list.replaceChildren();
  const visibleFiles = filteredFiles.slice(0, visibleCount);
  if (!visibleFiles.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No encontramos archivos con esos criterios. Prueba otra búsqueda o filtro.';
    list.appendChild(empty);
  } else {
    for (const f of visibleFiles) list.appendChild(renderCard(f));
  }
  status.textContent = `${filteredFiles.length} resultado${filteredFiles.length === 1 ? '' : 's'} · mostrando ${visibleFiles.length}`;
  updateUrl();
}

function loadMore() {
  if (visibleCount >= filteredFiles.length) return;
  const previousCount = visibleCount;
  visibleCount = Math.min(visibleCount + PAGE_SIZE, filteredFiles.length);
  for (const f of filteredFiles.slice(previousCount, visibleCount)) list.appendChild(renderCard(f));
  status.textContent = `${filteredFiles.length} resultados · mostrando ${visibleCount}`;
}

async function loadPublishedFiles() {
  try {
    const response = await fetch('/api/files', {cache: 'no-store'});
    if (!response.ok) throw new Error('No se pudo cargar el catálogo');
    const data = await response.json();
    ARCHIVOS = (data.files || []).map(file => ({
      nombre: file.filename,
      desc: 'Mod descargable',
      url: file.url,
      tipo: 'jar'
    }));
    suggestions.replaceChildren();
    for (const f of ARCHIVOS) {
      const option = document.createElement('option');
      option.value = f.nombre;
      suggestions.appendChild(option);
    }
    applyListing();
  } catch (error) {
    status.textContent = 'No se pudo cargar el catálogo. Intenta recargar la página.';
    console.error(error);
  }
}

searchInput.addEventListener('input', () => applyListing());
filterSelect.addEventListener('change', () => applyListing());
sortSelect.addEventListener('change', () => applyListing());

// Carga progresiva al acercarse al final de la lista.
window.addEventListener('scroll', () => {
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 500) loadMore();
}, {passive: true});

// Permite volver a un estado compartido usando atrás/adelante del navegador.
window.addEventListener('popstate', () => {
  readUrlState();
  applyListing();
});

readUrlState();
loadPublishedFiles();
</script>
</body>
</html>
