<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>47hub · Administración</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#181818;background:#f4f4f1}
*{box-sizing:border-box}body{margin:0;padding:28px 16px}
main{max-width:760px;margin:auto}.panel{background:white;border:2px solid #171717;border-radius:18px;padding:24px;box-shadow:6px 6px 0 #171717}
h1{margin:0 0 6px;font-size:2rem}p{color:#666;line-height:1.5}
label{display:block;font-weight:700;margin:16px 0 7px}
input{width:100%;padding:12px;border:2px solid #222;border-radius:10px;font:inherit}
button{border:2px solid #171717;border-radius:10px;background:#f6d64a;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 #171717}
button:disabled{opacity:.55;cursor:wait}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hidden{display:none!important}.status{margin-top:14px;min-height:24px}.file{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #ddd;padding:13px 0}.file small{display:block;color:#777;margin-top:4px}.danger{background:#fff}
.note{font-size:.9rem}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a{color:inherit}
</style>
</head>
<body><main>
<section class="panel">
<div class="top"><div><h1>47hub Admin</h1><p>Panel privado para administrar mods .jar.</p></div><a href="/">Ver catálogo público</a></div>
<div id="login">
<h2>Iniciar sesión</h2>
<form id="login-form">
<label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<div class="actions"><button id="login-button">Entrar</button></div>
</form>
</div>
<div id="dashboard" class="hidden">
<h2>Subir un mod</h2>
<form id="upload-form">
<label for="file">Archivo .jar</label><input id="file" name="file" type="file" accept=".jar,application/java-archive" required>
<p class="note">Solo se aceptan archivos .jar. El archivo publicado aparecerá en el catálogo público.</p>
<div class="actions"><button id="upload-button">Subir archivo</button><button type="button" class="danger" id="logout-button">Cerrar sesión</button></div>
</form>
<h2 style="margin-top:30px">Archivos publicados</h2><div id="files"></div>
</div>
<div id="status" class="status" role="status" aria-live="polite"></div>
</section></main>
<script type="module">
import { upload } from 'https://esm.sh/@vercel/blob/client@1.1.1';

const $ = id => document.getElementById(id);
const status = $('status');
const show = (id, yes) => $(id).classList.toggle('hidden', !yes);

async function api(url, options={}) {
  const response = await fetch(url, {credentials:'same-origin', ...options});
  const data = await response.json().catch(()=>({}));
  if (!response.ok) throw new Error(data.error || 'Ocurrió un error.');
  return data;
}
async function refresh() {
  try {
    const data = await api('/api/files');
    $('files').replaceChildren();
    if (!data.files.length) {
      $('files').textContent = 'Todavía no hay archivos publicados.';
      return;
    }
    for (const file of data.files) {
      const row = document.createElement('div'); row.className = 'file';
      const info = document.createElement('div');
      const link = document.createElement('a'); link.href = file.url; link.textContent = file.filename; link.target='_blank'; link.rel='noopener';
      const meta = document.createElement('small'); meta.textContent = `${(file.size/1024/1024).toFixed(2)} MB`;
      info.append(link, meta);
      const del = document.createElement('button'); del.className='danger'; del.textContent='Eliminar';
      del.addEventListener('click', async () => {
        if (!confirm(`¿Eliminar ${file.filename}?`)) return;
        try { await api('/api/admin/delete', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:file.url})}); status.textContent='Archivo eliminado.'; await refresh(); }
        catch(e){status.textContent=e.message;}
      });
      row.append(info, del); $('files').append(row);
    }
  } catch(e) { status.textContent = e.message; }
}
async function checkSession() {
  try { await api('/api/admin/session'); show('login',false); show('dashboard',true); await refresh(); }
  catch { show('login',true); show('dashboard',false); }
}
$('login-form').addEventListener('submit', async e => {
  e.preventDefault(); $('login-button').disabled=true; status.textContent='Iniciando sesión…';
  try {
    await api('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});
    $('password').value=''; status.textContent='Sesión iniciada.'; await checkSession();
  } catch(err){status.textContent=err.message;}
  finally{$('login-button').disabled=false;}
});
$('upload-form').addEventListener('submit', async e => {
  e.preventDefault();
  const file=$('file').files[0];
  if(!file) return;
  if(!file.name.toLowerCase().endsWith('.jar')) {status.textContent='Selecciona un archivo .jar.';return;}
  $('upload-button').disabled=true; status.textContent='Subiendo archivo…';
  try {
    await upload(`mods/${file.name}`, file, {
      access:'public',
      handleUploadUrl:'/api/admin/upload',
      clientPayload: JSON.stringify({originalName:file.name})
    });
    status.textContent='¡Archivo subido y publicado!';
    $('upload-form').reset(); await refresh();
  } catch(err){status.textContent=err.message || 'No se pudo subir el archivo.';}
  finally{$('upload-button').disabled=false;}
});
$('logout-button').addEventListener('click', async()=>{
  try{await api('/api/admin/logout',{method:'POST'});}catch{}
  show('login',true);show('dashboard',false);status.textContent='Sesión cerrada.';
});
checkSession();
</script>
</body></html>
